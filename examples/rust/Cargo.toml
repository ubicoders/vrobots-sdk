[package]
name = "vrobots-examples"
description = "The VRobots SDK example programs in Rust, one binary per example, against the vrobots-sdk crate"
# Edition 2024 needs Rust 1.85, which the 1.88 minimum below already covers.
# The wrapper crates are on 2021; each package of a workspace keeps its own.
edition = "2024"
# The minimum of the vrobots-sdk crate, whose -sys build script needs Rust 1.88.
rust-version = "1.88"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/ubicoders/vrobots-sdk"
publish = false

# Every example is a complete program with its own `fn main`, in the STM32
# shape: main() does setup, then owns a plain loop. No command-line options
# anywhere: a permutation worth showing is its own file, not a flag. Run one
# from the repository root with:
#     cargo run -p vrobots-examples --bin ex01_hello_states
#
# The one argument any example takes is a sys_id: required by ex29-ex33 and
# ex35, whose robots are scene-authored rather than created (their ids are
# handed out at scene load and keep incrementing, so no `const` in the file
# could stay true), and optional for ex21, ex22 and ex27.
#     cargo run -p vrobots-examples --bin ex31_globalhawk_direct -- 15

[features]
# Link the static C library instead of the shared one, so that the examples
# need no shared library at run time. Forwarded to the vrobots-sdk crate.
#     cargo run -p vrobots-examples --features static --bin ex01_hello_states
static = ["vrobots-sdk/static"]
# ex34 is the only example that needs a library outside the SDK. It is off by
# default so that building the examples never needs OpenCV installed:
# `required-features` below makes cargo skip that binary instead.
#     cargo run -p vrobots-examples --features opencv --bin ex34_camera_view
opencv = ["dep:opencv"]

[dependencies]
# A path dependency on the wrapper in this repository: the examples are always
# built against the checkout they live in, so they carry no version of their own.
vrobots-sdk = { path = "../../crates/vrobots-sdk" }
# Binds to whatever OpenCV is installed on the machine; bump this minor to match
# the binding release your system OpenCV needs.
opencv = { version = "0.94", optional = true, default-features = false, features = [
    "imgproc",
    "highgui",
] }

[[bin]]
name = "ex01_hello_states"
path = "src/bin/ex01_hello_states.rs"

