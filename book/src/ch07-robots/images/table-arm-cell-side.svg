.fov-wocc{fill: var(--muted); fill-opacity: .14; stroke: var(--muted); stroke-opacity: .5; stroke-width: 1; stroke-dasharray: 3 3;}
.link{fill: none; stroke: var(--metal); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; opacity: .85;}
.joint{fill: #f1f3f5; stroke: #495057; stroke-width: 1.4;}
.grip{fill: #495057; stroke: #212529; stroke-width: 1;}
.lead{stroke: var(--muted); stroke-width: .8; stroke-dasharray: 2 3; fill: none;}
</style>
