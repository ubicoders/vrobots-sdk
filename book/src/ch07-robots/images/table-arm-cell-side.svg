<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840.0 840.0" width="840" height="840" role="img" aria-label="TableArm side view to scale: table camera 1.70 m above the board with its 50 degree view, the UR10 schematic with the tool down over the Camera Zone and the wrist camera view">
