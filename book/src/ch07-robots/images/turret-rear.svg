<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 562.8" width="960" height="562.8" role="img" aria-label="Turret rear view: stereo cameras on top of the head, 0.80 m apart, 0.35 m above the pivot">
<title>Turret rear view: stereo cameras on top of the head, 0.80 m apart, 0.35 m above the pivot</title>
<style>
:root{--bg:#f4f6f6;--panel:#ffffff;--ink:#1c2329;--muted:#5d6870;--line:#cfd6d9;--grid:#e4e9ea;--left:#1864ab;--right:#a61e4d;--lidar:#2b8a3e;--metal:#8a959c;--metal-2:#c3cbcf;--mono:ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace}
@media (prefers-color-scheme: dark){:root{--bg:#12171b;--panel:#1a2126;--ink:#e3e8eb;--muted:#97a3ab;--line:#34404a;--grid:#222b31;--left:#74b4f0;--right:#f07fa6;--lidar:#69db7c;--metal:#6f7b83;--metal-2:#3f484e}}
svg text{font-family: var(--mono); font-size: 12px; fill: var(--ink);}
svg .t-muted{fill: var(--muted);}
svg .t-left{fill: var(--left); font-weight: 600;}
svg .t-right{fill: var(--right); font-weight: 600;}
.grid{stroke: var(--grid); stroke-width: 1;}
.floor{stroke: var(--muted); stroke-width: 1.5;}
.body{fill: var(--metal-2); stroke: var(--metal); stroke-width: 1; stroke-linejoin: round;}
.part{fill: none; stroke: var(--metal); stroke-width: 1.2;}
.origin{fill: var(--panel); stroke: var(--ink); stroke-width: 1.6;}
.m-left{fill: var(--left);}
.m-right{fill: var(--right);}
.lead{stroke: var(--muted); stroke-width: .8; stroke-dasharray: 2 3; fill: none;}
.pivot{fill: #e8590c;}
.ring-p{fill: none; stroke: #e8590c; stroke-width: 1.4;}
svg .t-pivot{fill: #e8590c; font-weight: 600;}
</style>
