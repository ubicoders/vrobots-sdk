<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870.0 825.0" width="870" height="825" role="img" aria-label="TableArm cell, top view to scale: board, arm base, camera zone, white box, five bins, six objects, reach circles and camera footprints">
<title>TableArm cell, top view to scale: board, arm base, camera zone, white box, five bins, six objects, reach circles and camera footprints</title>
<style>
:root{--bg:#f4f6f6;--panel:#ffffff;--ink:#1c2329;--muted:#5d6870;--line:#cfd6d9;--grid:#e4e9ea;--grid5:#d3dadd;--tcam:#1864ab;--wcam:#a61e4d;--reach:#e8590c;--ok:#2b8a3e;--warn:#b35c00;--out:#c92a2a;--metal:#8a959c;--metal-2:#c3cbcf;--board:#2b3035;--boardline:#11151a;--zone:#f8f9fa;--bin:#9aa5ab;--bininner:#c8d0d4;--mono:ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace}
