svg .t-arm{fill: var(--ink); font-weight: 600; font-size: 12px;}
.grid{stroke: var(--grid); stroke-width: 1;}
.grid5{stroke: var(--grid5); stroke-width: 1.2;}
.board{fill: var(--board); stroke: var(--boardline); stroke-width: 1.2;}
