.whitebox{fill: #f1f3f5; stroke: #868e96; stroke-width: 1;}
.bin{fill: var(--bin); stroke: var(--metal); stroke-width: 1;}
.bininner{fill: var(--bininner);}
.lowwall{fill: var(--reach); fill-opacity: .8;}
.armbase{fill: var(--metal-2); stroke: var(--metal); stroke-width: 1.2;}
.ur{fill: #f1f3f5; stroke: #868e96; stroke-width: 1.2;}
.cross{stroke: var(--ink); stroke-width: 1.2;}
.obj-red{fill: #e03131; stroke: #7d1a1a; stroke-width: 1;}
.obj-yel{fill: #fcc419; stroke: #8a6a00; stroke-width: 1;}
.obj-cyan{fill: #22b8cf; stroke: #0b6170; stroke-width: 1;}
.apex{fill: #0b3d45;}
.reach1{fill: none; stroke: var(--reach); stroke-width: 1.6; stroke-dasharray: 8 5;}
.reach2{fill: none; stroke: var(--reach); stroke-width: 1.4; stroke-dasharray: 2 4;}
.tfoot{fill: var(--tcam); fill-opacity: .06; stroke: var(--tcam); stroke-width: 1.6;}
.tfoot2{fill: none; stroke: var(--tcam); stroke-width: 1; stroke-dasharray: 3 4;}
.m-tcam{fill: var(--tcam); stroke: var(--panel); stroke-width: 1.5;}
.m-wcam{fill: var(--wcam); stroke: var(--panel); stroke-width: 1.5;}
.wfoot{fill: var(--wcam); fill-opacity: .12; stroke: var(--wcam); stroke-width: 1.4;}
.wocc{fill: url(#hatch); stroke: none;}
.axisline{stroke: var(--wcam); stroke-width: 1; stroke-dasharray: 4 3;}
.toolaxis{fill: none; stroke: var(--wcam); stroke-width: 1.6;}
.origin{fill: var(--zone); stroke: var(--ink); stroke-width: 1.2;}
.axes line{stroke: var(--ink); stroke-width: 1.4;}
.axes text{font-size: 11px; fill: var(--muted);}
</style>
